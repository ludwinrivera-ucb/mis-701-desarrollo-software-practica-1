<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Librería Ideas | Registrar Venta</title>
    <link rel="stylesheet" href="../css/normalize.css" />
    <link rel="stylesheet" href="../css/style.css" />
</head>

<body>
    <header>
        <div class="top-bar">
            <div class="banner-logo">I</div>
            <span>Librería Ideas</span>
            <a href="../index.html" class="sale-link">Cerrar sesión</a>
        </div>
        <nav>
            <a href="../dashboard.html">Inicio</a>
            <a href="productos.html">Productos</a>
            <a href="add-producto.html">Registrar producto</a>
            <a href="ventas.html">Ventas</a>
            <a class="active" href="add-venta.html">Registrar venta</a>
        </nav>

    </header>
    <main>
        <div class="content-header">
            <h2>Nueva venta</h2>
        </div>

        <div class="form-register">
            <form id="form-add-sale" action="ventas.html" method="get">
                <div class="full-width">
                    <label for="product">Producto</label>
                    <input type="text" id="product" name="product" placeholder="Ej. Cuaderno espiral 100 hojas Líder"
                        required>
                </div>

                <div>
                    <label for="quantity">Cantidad</label>
                    <input type="number" id="quantity" name="quantity" min="1" value="1" placeholder="1" required>
                </div>

                <div>
                    <label for="price">Precio unitario (Bs.)</label>
                    <input type="number" id="price" name="price" step="0.50" min="0" placeholder="0.00" required>
                </div>

                <div>
                    <label for="date">Fecha de la venta</label>
                    <input type="date" id="date" name="date" required>
                </div>

                <div>
                    <label for="status">Estado del pago</label>
                    <select id="status" name="status" required>
                        <option value="ok" selected>Pagado</option>
                        <option value="warn">En proceso</option>
                        <option value="danger">Pendiente</option>
                    </select>
                </div>

                <div>
                    <label for="customer">Cliente (Opcional)</label>
                    <input type="text" id="customer" name="customer" placeholder="Ej. Juan Pérez">
                </div>

                <div>
                    <label for="payment_method">Método de pago</label>
                    <select id="payment_method" name="payment_method">
                        <option value="efectivo" selected>Efectivo</option>
                        <option value="qr">Transferencia / QR</option>
                        <option value="tarjeta">Tarjeta Débito/Crédito</option>
                    </select>
                </div>

                <div class="full-width">
                    <label for="notes">Notas o detalles adicionales</label>
                    <textarea id="notes" name="notes" rows="2"
                        placeholder="Observaciones sobre la venta o entrega..."></textarea>
                </div>

                <!-- Acciones del formulario -->
                <div class="full-width">
                    <button type="submit">Registrar venta</button>
                    <a href="ventas.html">Cancelar</a>
                </div>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Librería Ideas. All rights reserved.</p>
    </footer>

    <script src="../js/ideas.js"></script>
</body>

</html>
