<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Librería Ideas | Login</title>
    <link rel="stylesheet" href="./css/normalize.css" />
    <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
    <div class="login-page">
        <div class="banner">
            <div class="banner-logo">I</div>
            <p class="banner-title">Librería Ideas</p>
            <h1>Gestion de inventarios y ventas.</h1>
            <p class="banner-text">
                Tu pones las ideas y nosotros los materiales para que tu proyecto sea un exito.
            </p>
        </div>
        <div class="login-form">
            <p class="welcome">Bienvenido</p>
            <h2>Iniciar sesión</h2>

            <form action ="dashboard.html">
                <label for="usuario">Usuario</label>
                <input type="text" placeholder="Ingresa tu usuario">

                <label for="password">Contraseña</label>
                <input type="password" placeholder="Ingresa tu contraseña">

                <button type="submit">Iniciar sesión</button>
            </form>
        </div>
    </div>
    
</body>
</html>
