<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Librería Ideas | Login</title>
    <link rel="stylesheet" href="./css/normalize.css" />
    <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
    <div class="login-page">
        <div class="banner">
            <div class="banner-logo">I</div>
            <p class="banner-title">Librería Ideas</p>
            <h1>Gestión de inventarios y ventas.</h1>
            <p class="banner-text">
                Tú pones las ideas y nosotros los materiales para que tu proyecto sea un éxito.
            </p>
        </div>
        <div class="login-form">
            <p class="welcome">Bienvenido</p>
            <h2>Iniciar sesión</h2>

            <form action="dashboard.html" method="get" class="form-login">
                <div>
                    <label>Correo electrónico</label>
                    <input type="email" name="email" placeholder="admin@email.com" required autocomplete="email">
                </div>

                <div>
                    <label>Contraseña</label>
                    <input type="password" name="password" placeholder="Ingresa tu contraseña" required autocomplete="current-password">
                </div>

                <button type="submit">Iniciar sesión</button>
            </form>
        </div>
    </div>
</body>
</html>
